name: bootstrap-final-release
on:
  push:
    paths:
      - '.bootstrap/READY_FINAL2'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconstruct and verify release archive
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/lean.b64.part-* > /tmp/release.b64
          base64 -d /tmp/release.b64 > /tmp/release.tar.xz
          echo "ad061f753cfece30db26bc0cae44150730c65e52f340ad0d2a68e28fd7667b2c  /tmp/release.tar.xz" | sha256sum -c -
          rm -rf /tmp/release
          mkdir -p /tmp/release
          tar -xJf /tmp/release.tar.xz -C /tmp/release
      - name: Remove CI workflow and regenerate release manifest
        shell: bash
        run: |
          set -euo pipefail
          rm -f /tmp/release/.github/workflows/ci.yml
          rm -rf /tmp/release/.github
          python - <<'PY'
          from pathlib import Path
          import json, hashlib
          root=Path('/tmp/release')
          mp=root/'RELEASE_MANIFEST.json'
          j=json.loads(mp.read_text())
          j['policy']='Final executable code, locked configurations/protocols, tests, compact final summaries and breakpoint tables. CI workflow is intentionally omitted from this archival branch because repository workflow-write permissions are restricted; deterministic verification is provided by verify_release.py. Seed/per-repetition/paired/trajectory/supplementary-output tables and manuscript/submission files are intentionally not tracked in Git.'
          files=[]
          for p in sorted(root.rglob('*')):
              if not p.is_file() or p==mp:
                  continue
              rel=p.relative_to(root).as_posix()
              data=p.read_bytes().replace(b'\r\n',b'\n')
              files.append({'path':rel,'normalized_bytes':len(data),'sha256_lf_normalized':hashlib.sha256(data).hexdigest()})
          j['files']=files
          mp.write_text(json.dumps(j,indent=2,ensure_ascii=False)+'\n')
          print('release files including manifest:', sum(1 for p in root.rglob('*') if p.is_file()))
          print('manifest entries:', len(files))
          PY
      - name: Build reviewable release branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Ercan Erkalkan"
          git config user.email "ercan.erkalkan@marmara.edu.tr"
          git checkout -B release-final
          git rm -rf .bootstrap
          find . -maxdepth 1 -mindepth 1 ! -name '.git' ! -name '.github' -exec rm -rf {} +
          cp -a /tmp/release/. .
          git add -A
          git commit -m "Publish reproducible conformal shift stress-test artifact v1.0.0"
          git push origin HEAD:refs/heads/release-final
